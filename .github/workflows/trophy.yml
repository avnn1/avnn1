name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # auto-update tiap hari jam 00:00 UTC
  workflow_dispatch:        # biar bisa dijalanin manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: avnn1
          file: trophy.svg
          theme: tokyonight
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --cached --quiet || git commit -m "chore: update trophy svg"
          git push origin HEAD:main
